name: refresh-contributions
# 매일 06:17(KST, 21:17 UTC)에 외부 오픈소스 기여 상태를 갱신한다. 정각(0분)은 GitHub Actions가 몰려 지연·누락이 잦아 17분에 돌린다.
# 바뀐 것이 없으면 변경 확인에서 끝난다. 바뀐 날에는 이 순서로 한다.
#   검증(단위 시험·빌드) → JSON 커밋·푸시(Vercel이 배포) → 공개 PDF 다시 만들기 → 전체 e2e → PDF 커밋·푸시
# 봇이 올린 커밋은 ci.yml을 실행하지 않는다. 데이터에 따라 달라지는 화면을 확인하는 e2e는 여기가 유일한 관문이다.
# PDF를 만들지 못하거나 e2e를 통과하지 못하면 작업이 실패해 소유자에게 메일이 간다. 그때 JSON은 이미 올라가 사이트는 갱신된 뒤다.
# PDF는 마지막으로 성공한 판이 그대로 남고, 그 PDF 자신의 "마지막 변경" 날짜가 어느 시점의 판인지 밝힌다.
# 미리보기 서버는 프로젝트당 하나뿐이라, make-pdf가 자기 서버를 멈춘 뒤에 Playwright가 서버를 띄우도록 단계를 나눴다.
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-contributions
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh contribution data
        run: node --experimental-strip-types scripts/refresh-contributions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Exit if unchanged
        id: changed
        run: |
          if git diff --quiet -- src/data/contributions.json; then
            echo "변경 없음"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate (unit tests + build)
        if: steps.changed.outputs.changed == 'true'
        run: npm test && npm run build
      - name: Commit and push the data
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contributions.json
          git commit -m "chore(data): 오픈소스 기여 상태 자동 갱신"
          git push
      - name: Read the Playwright version
        id: playwright
        if: steps.changed.outputs.changed == 'true'
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        if: steps.changed.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.changed.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Regenerate the public PDF
        if: steps.changed.outputs.changed == 'true'
        run: node scripts/make-pdf.mjs
      - name: Full e2e gate
        if: steps.changed.outputs.changed == 'true'
        run: npx playwright test
      - name: Commit and push the PDF
        if: steps.changed.outputs.changed == 'true'
        run: |
          if git diff --quiet -- public/portfolio.pdf; then
            echo "PDF 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portfolio.pdf
          git commit -m "chore(data): 공개 PDF 자동 갱신"
          git push
